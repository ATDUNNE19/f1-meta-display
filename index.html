<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>F1 Live Timing — Meta Display</title>
<style>
:root{color-scheme:dark;--fg:#f7f7f7;--muted:#a9adb4;--line:#3a3d42}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:var(--fg);font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
.screen{position:relative;width:min(100vw,100vh,600px);height:min(100vw,100vh,600px);margin:auto;padding:22px 24px 18px;display:flex;flex-direction:column;background:rgba(0,0,0,.3)}
header{display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:13px;border-bottom:2px solid #f4f4f4}
.brand{font-size:19px;font-weight:900;letter-spacing:1.7px;line-height:1}
.session{margin-top:6px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.8px;text-transform:uppercase;max-width:355px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.7px}
.dot{width:8px;height:8px;border-radius:50%;background:#8b8b8b;display:inline-block}
.dot.live{background:#50e080;box-shadow:0 0 9px #50e080}
.radio-tools{display:flex;gap:5px;padding:4px 0 1px;align-items:center}.replay-tools{display:flex;gap:5px;align-items:center;padding:2px 0 0}.replay-tools button,.replay-tools select{background:#17191c;color:#fff;border:1px solid #555;border-radius:4px;padding:4px 5px;font-size:9px;font-weight:900;touch-action:manipulation;min-width:0}.replay-tools select{flex:1;width:90px}.scrub-tools{display:flex;align-items:center;gap:5px;padding:1px 0}.scrub-tools input{flex:1;min-width:0;height:12px;accent-color:#ff3b30;touch-action:pan-x}.scrub-tools span{font-size:8px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.radio-tools button,.panel button{touch-action:manipulation;pointer-events:auto;position:relative;z-index:2;background:#17191c;color:#fff;border:1px solid #555;border-radius:4px;padding:4px 6px;font-size:9px;font-weight:900;letter-spacing:.2px}
.radio-tools button.active{border-color:#50e080;color:#50e080}
.radio-tools button:disabled{opacity:.45}
#radioStatus{font-size:8px;color:var(--muted);align-self:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel{display:none;position:absolute;z-index:10;top:92px;left:10px;right:10px;border:1px solid #777;border-radius:5px;padding:6px;margin:3px 0;background:#111;max-height:135px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.8)}
.panel.open{display:block}
.panelTitle{font-size:9px;color:var(--muted);font-weight:800;margin-bottom:4px}
#driverChoices{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.panel button.chosen{border-color:#50e080;color:#50e080;background:#102016}
.panel .panelActions{display:flex;gap:4px;margin-top:5px}
.columns,.driver{display:grid;grid-template-columns:30px minmax(0,1fr) 82px 82px;align-items:center;column-gap:8px}
.columns{padding:6px 0 5px;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.55px;text-transform:uppercase}
.columns span:nth-child(3),.columns span:nth-child(4){text-align:right}
#rows{display:flex;flex-direction:column;flex:1;min-height:0}
.driver{min-height:0;flex:1;border-bottom:1px solid var(--line);position:relative}
.pos{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;color:#c7cbd0}
.identity{min-width:0;display:flex;align-items:center;gap:8px}
.teambar{width:4px;height:25px;background:#888;flex:none;border-radius:2px}
.code{font-size:18px;font-weight:900;letter-spacing:.5px;white-space:nowrap}
.number{font-size:10px;color:var(--muted);font-weight:700;margin-left:2px}
.gap{text-align:right;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.gap.ahead{color:#d6d9dd}.gap.leader{color:#fff}
footer{display:flex;justify-content:space-between;align-items:center;padding-top:5px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.4px}
#message{color:#e7e7e7;font-size:9px;text-align:center;padding:2px 0 0;min-height:11px}
.view-tabs{display:flex;gap:4px;padding:5px 0}
.view-tabs button{flex:1;background:#17191c;color:#bbb;border:1px solid #555;border-radius:4px;padding:6px 3px;font-size:10px;font-weight:900;letter-spacing:.4px;touch-action:manipulation}
.view-tabs button.active{background:#292929;color:#fff;border-color:#ff3b30}
.view{display:none;flex:1;min-height:0;overflow:hidden}
.view.active{display:flex;flex-direction:column}
#trackCanvas{width:100%;height:100%;min-height:180px;display:block}
.track-note{font-size:9px;color:var(--muted);text-align:center;padding:3px}
.telemetry-head,.telemetry-row{display:grid;grid-template-columns:25px 48px 1fr 1fr 1fr 1fr 1fr;gap:3px;align-items:center}
.telemetry-head{font-size:8px;color:var(--muted);font-weight:900;padding:4px 2px;border-bottom:1px solid #777}
#telemetryRows{overflow:auto;min-height:0;flex:1}
.telemetry-row{min-height:19px;border-bottom:1px solid var(--line);font-size:9px;font-variant-numeric:tabular-nums}
.telemetry-row .tpos{font-weight:900;color:#ccc}
.telemetry-row .tdriver{display:flex;gap:4px;align-items:center;font-weight:900}
.telemetry-row .tbar{width:3px;height:13px;border-radius:2px;flex:none}
.telemetry-row span:not(.tdriver){text-align:right}
.telemetry-head span{text-align:right}
.telemetry-head span:nth-child(1),.telemetry-head span:nth-child(2){text-align:left}
@media(max-width:420px){.telemetry-head,.telemetry-row{grid-template-columns:20px 39px 1fr 1fr 1fr 1fr 1fr;gap:2px}.telemetry-row{font-size:8px}.telemetry-head{font-size:7px}}

.error{color:#ff9b91}
audio{display:none}
@media(max-width:420px){.screen{padding:16px 15px 12px}.columns,.driver{grid-template-columns:25px minmax(0,1fr) 69px 69px;column-gap:5px}.code{font-size:16px}.gap{font-size:11px}.brand{font-size:17px}#driverChoices{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main class="screen" aria-label="Formula One live timing leaderboard">
<header><div><div class="brand">F1 <span style="color:#ff3b30">LIVE TIMING</span></div><div class="session" id="session">CONNECTING TO TIMING DATA</div></div><div class="status"><span class="dot" id="dot"></span><span id="state">WAIT</span></div></header>
<div class="radio-tools"><button id="liveFeedBtn" type="button">LIVE FEED</button><button id="radioToggle" type="button">RADIO OFF</button><button id="driverToggle" type="button">SELECT DRIVERS</button><span id="radioStatus">Choose drivers for team radio</span></div>
<div class="replay-tools"><select id="raceSelect" aria-label="Choose a race"><option value="">Loading 2026 races…</option></select><button id="loadSeasonRace" type="button">LOAD RACE</button><button id="replayBtn" type="button">REPLAY RACE</button><select id="speedSelect" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="5">5×</option><option value="10">10×</option></select></div><div class="scrub-tools"><input id="replayScrubber" type="range" min="0" max="0" value="0" step="1" aria-label="Scrub through race replay"><span id="scrubTime">00:00</span></div><span id="replayStatus">Choose a 2026 race</span><section class="panel" id="driverPanel"><div class="panelTitle">TAP EACH DRIVER YOU WANT TO HEAR</div><div id="driverChoices">Waiting for driver list…</div><div class="panelActions"><button id="allDrivers" type="button">SELECT ALL</button><button id="noDrivers" type="button">CLEAR</button><button id="closePanel" type="button">DONE</button></div></section>
<div class="view-tabs" role="tablist" aria-label="Timing views">
<button type="button" class="active" data-view="leaderboard">LEADERBOARD</button><button type="button" data-view="track">TRACK</button><button type="button" data-view="telemetry">TELEMETRY</button>
</div>
<section class="view active" id="leaderboardView"><div class="columns"><span>POS</span><span>DRIVER</span><span>TO AHEAD</span><span>TO LEAD</span></div><section id="rows" aria-live="polite"></section></section>
<section class="view" id="trackView"><svg id="trackCanvas" viewBox="0 0 500 360" role="img" aria-label="Live car positions on circuit"></svg><div class="track-note" id="trackNote">Waiting for car location data</div></section>
<section class="view" id="telemetryView"><div class="telemetry-head"><span>POS</span><span>CAR</span><span>KM/H</span><span>GEAR</span><span>RPM</span><span>THR %</span><span>BRK</span></div><div id="telemetryRows"></div></section>
<div id="message">Loading latest session…</div>
<footer><span id="lap">LAP —</span><span id="updated">NO DATA YET</span></footer>
<audio id="radioAudio" preload="none"></audio>
</main>
<script>
(()=>{'use strict';
const API='https://f1-openf1-proxy.alfydunne.workers.dev/v1',POLL_MS=10000,RADIO_POLL_MS=15000,$=id=>document.getElementById(id);
let sessionKey='latest',lastGood=null,busy=false,firstLoad=true,testMode=false,currentSession=null,driverList=[],selected=new Set(),radioEnabled=false,radioPrimed=false,knownRadio=new Set(),radioQueue=[],radioBusy=false,radioFirstPoll=true,replayPositions=[],replayIntervals=[],replayLaps=[],replayTimes=[],replayIndex=0,replayTimer=null,replayPlaying=false,historicalRadio=[],playedHistoricalRadio=new Set();
let locationRows=[],carDataRows=[],trackOutlineRows=[],activeView='leaderboard';
try{selected=new Set(JSON.parse(localStorage.getItem('f1-radio-drivers')||'[]').map(Number))}catch(e){}
async function get(path){const r=await fetch(`${API}/${path}`,{cache:'no-store'});if(!r.ok)throw new Error(`OpenF1 returned ${r.status}`);return r.json()}
function latestByDriver(records){const m=new Map();for(const x of records||[]){const old=m.get(x.driver_number);if(!old||String(x.date||'')>String(old.date||''))m.set(x.driver_number,x)}return m}
function nearestByDriver(records,stamp,validLocation=false){
const target=Date.parse(stamp),m=new Map();
for(const x of records||[]){
const n=Number(x.driver_number),time=Date.parse(x.date);
if(!Number.isFinite(n)||!Number.isFinite(time))continue;
if(validLocation&&(!Number(x.x)||!Number(x.y)))continue;
const old=m.get(n),distance=Math.abs(time-target);
if(!old||distance<old.distance)m.set(n,{record:x,distance});
}
return new Map([...m].map(([n,v])=>[n,v.record]));
}
function interpolatedLocations(records,stamp){
const target=Date.parse(stamp),groups=new Map();
for(const row of records||[]){const n=Number(row.driver_number),time=Date.parse(row.date),x=Number(row.x),y=Number(row.y);if(!Number.isFinite(n)||!Number.isFinite(time)||!Number.isFinite(x)||!Number.isFinite(y)||x===0||y===0)continue;if(!groups.has(n))groups.set(n,[]);groups.get(n).push(row)}
const result=new Map();
for(const [n,rows] of groups){rows.sort((a,b)=>Date.parse(a.date)-Date.parse(b.date));let before=null,after=null;for(const row of rows){const t=Date.parse(row.date);if(t<=target)before=row;if(t>=target){after=row;break}}
if(before&&after){const a=Date.parse(before.date),b=Date.parse(after.date),f=b===a?0:Math.max(0,Math.min(1,(target-a)/(b-a)));result.set(n,{...before,x:Number(before.x)+(Number(after.x)-Number(before.x))*f,y:Number(before.y)+(Number(after.y)-Number(before.y))*f,date:stamp})}
else if(before||after)result.set(n,before||after)}
return result;
}
function gapText(v){if(v===null||v===undefined)return '—';if(typeof v==='string')return v.toUpperCase().includes('LAP')?v.replace(' ',''):v;return `+${Number(v).toFixed(3)}`}
function render(positionRows,intervalRows,drivers,session,lapRows){
const positions=latestByDriver(positionRows),intervals=latestByDriver(intervalRows),driverMap=new Map((drivers||[]).map(d=>[d.driver_number,d]));
driverList=(drivers||[]).slice().sort((a,b)=>(a.name_acronym||'').localeCompare(b.name_acronym||''));drawDriverChoices();
const list=[...positions.entries()].map(([number,p])=>({number,position:Number(p.position),driver:driverMap.get(number),timing:intervals.get(number)})).filter(x=>Number.isFinite(x.position)&&x.position>0).sort((a,b)=>a.position-b.position).slice(0,10);
if(!list.length)throw new Error('No classification data is available for the latest session yet.');
$('rows').innerHTML=list.map(x=>{const d=x.driver||{},acronym=d.name_acronym||`#${x.number}`,colour=/^([0-9a-f]{6})$/i.test(d.team_colour||'')?`#${d.team_colour}`:'#888',t=x.timing||{};return `<div class="driver"><span class="pos">${x.position}</span><span class="identity"><i class="teambar" style="background:${colour}"></i><span class="code">${acronym}</span><span class="number">${x.number}</span></span><span class="gap ahead">${gapText(t.interval)}</span><span class="gap leader">${gapText(t.gap_to_leader)}</span></div>`}).join('');
renderTrack(positions,drivers);renderTelemetry(positions,drivers,carDataRows);
const name=session?`${session.country_name||''} ${session.session_name||''}`.trim():'LATEST SESSION';$('session').textContent=name||'LATEST SESSION';
const nums=(lapRows||[]).map(x=>Number(x.lap_number)).filter(Number.isFinite),max=nums.length?Math.max(...nums):null;
$('lap').textContent=max?`LAP ${max}`:(session?.session_type||'SESSION');$('updated').textContent=`UPDATED ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
$('dot').classList.add('live');$('state').textContent='DATA OK';$('message').textContent='GAPS: CAR AHEAD / RACE LEADER';$('message').className='';lastGood=Date.now();
}
function drawDriverChoices(){
if(!driverList.length)return;
$('driverChoices').innerHTML=driverList.map(d=>{const n=Number(d.driver_number),ac=d.name_acronym||d.full_name||String(n);return `<button type="button" class="${selected.has(n)?'chosen':''}" data-driver="${n}">${ac}</button>`}).join('');
$('driverToggle').textContent=selected.size?`DRIVERS ${selected.size}`:'SELECT DRIVERS';
}
function saveSelection(){localStorage.setItem('f1-radio-drivers',JSON.stringify([...selected]));drawDriverChoices();$('radioStatus').textContent=selected.size?`${selected.size} driver(s) selected`:'No drivers selected';}
$('driverChoices').addEventListener('click',e=>{const b=e.target.closest('[data-driver]');if(!b)return;const n=Number(b.dataset.driver);selected.has(n)?selected.delete(n):selected.add(n);saveSelection()});
async function loadSeasonRaceList(){try{const year=new Date().getFullYear(),now=Date.now();$('raceSelect').innerHTML='<option value="">Loading races…</option>';const sessions=await get(`sessions?year=${year}`);const races=(sessions||[]).filter(s=>s.session_key&&s.date_start&&Date.parse(s.date_start)<=now&&String(s.session_name||'').trim().toLowerCase()==='race').sort((a,b)=>Date.parse(b.date_start)-Date.parse(a.date_start));$('raceSelect').innerHTML=races.length?races.map(s=>`<option value="${s.session_key}">${s.country_name||s.location||'Race'} — ${new Date(s.date_start).toLocaleDateString()}</option>`).join(''):'<option value="">No completed races found</option>';if(races.length)$('replayStatus').textContent=`${races.length} completed ${year} race(s) available`;else $('replayStatus').textContent=`No completed ${year} races yet`}catch(e){$('raceSelect').innerHTML='<option value="">Race list unavailable</option>';$('replayStatus').textContent='Could not load current-season races'}}
$('liveFeedBtn').onclick=()=>{stopReplay();testMode=false;lastReplayMotionStamp='';lastReplayMotionFetchAt=0;replayMotionRequest++;firstLoad=true;sessionKey='latest';currentSession=null;replayPositions=[];replayIntervals=[];replayLaps=[];replayTimes=[];replayIndex=0;historicalRadio=[];playedHistoricalRadio.clear();radioFirstPoll=true;knownRadio.clear();radioQueue=[];$('replayScrubber').max='0';$('replayScrubber').value='0';$('scrubTime').textContent='00:00';$('replayStatus').textContent='Live timing feed';$('message').textContent='Connecting to live timing…';$('state').textContent='WAIT';$('dot').classList.remove('live');refresh()};
$('loadSeasonRace').onclick=async()=>{try{stopReplay();const key=$('raceSelect').value;if(!key){$('replayStatus').textContent='Choose a completed race first';return}$('message').textContent='Loading selected race…';const sessions=await get(`sessions?session_key=${key}`);currentSession=sessions?.[0]||null;if(!currentSession)throw new Error('Race session not found');sessionKey=key;testMode=true;lastReplayMotionStamp='';replayMotionRequest++;firstLoad=false;radioFirstPoll=true;knownRadio.clear();radioQueue=[];historicalRadio=[];playedHistoricalRadio.clear();const [p,i,d,l,outline]=await Promise.all([get(`position?session_key=${key}`),get(`intervals?session_key=${key}`),get(`drivers?session_key=${key}`),get(`laps?session_key=${key}`),get(`location?session_key=${key}&driver_number=1`).catch(()=>[])]);replayPositions=p||[];replayIntervals=i||[];replayLaps=l||[];trackOutlineRows=(outline||[]).filter(x=>Number(x.x)!==0&&Number(x.y)!==0).sort((a,b)=>Date.parse(a.date)-Date.parse(b.date));locationRows=[];carDataRows=[];replayTimes=[...new Set(replayPositions.map(x=>x.date).filter(Boolean))].sort();if(!replayTimes.length)throw new Error('No replay timing data available for this race');replayIndex=0;$('replayScrubber').max=String(Math.max(0,replayTimes.length-1));$('replayScrubber').value='0';showReplayFrame(0);$('replayStatus').textContent=`${replayTimes.length} replay updates loaded`;$('message').textContent='Race loaded — tap REPLAY RACE';}catch(e){$('message').textContent='RACE LOAD ERROR: '+e.message;$('message').className='error'}};
function stopReplay(){if(replayTimer)clearTimeout(replayTimer);replayTimer=null;replayPlaying=false;$('replayBtn').textContent='REPLAY RACE'}
function showReplayFrame(index){if(!replayTimes.length)return;replayIndex=Math.max(0,Math.min(index,replayTimes.length-1));const t=replayTimes[replayIndex],p=replayPositions.filter(x=>x.date<=t),i=replayIntervals.filter(x=>x.date<=t),l=replayLaps.filter(x=>x.date<=t);render(p,i,driverList,currentSession,l);const replayStamp=Date.parse(t);loadReplayMotion(t,p);$('updated').textContent=new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('replayScrubber').value=String(replayIndex);$('scrubTime').textContent=new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('replayStatus').textContent=`Race replay ${Math.round((replayIndex+1)/replayTimes.length*100)}% · ${$('speedSelect').value}×`;if(testMode&&radioEnabled&&historicalRadio.length){const due=historicalRadio.filter(x=>Date.parse(x.date)<=Date.parse(t)&&!playedHistoricalRadio.has(radioKey(x))&&selected.has(Number(x.driver_number)));due.forEach(x=>{playedHistoricalRadio.add(radioKey(x));radioQueue.push(x)});if(due.length){$('radioStatus').textContent=`${new Date(due[0].date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})} · ${due.length} radio clip(s) due`;playNext()}}}
function scheduleReplayStep(){if(!replayPlaying)return;showReplayFrame(replayIndex);if(replayIndex>=replayTimes.length-1){stopReplay();$('replayBtn').textContent='REPLAY AGAIN';$('replayStatus').textContent='Race replay finished';return}const a=Date.parse(replayTimes[replayIndex]),b=Date.parse(replayTimes[replayIndex+1]),speed=Number($('speedSelect').value)||1;replayIndex++;const delay=Math.max(50,Number.isFinite(a)&&Number.isFinite(b)?(b-a)/speed:1000/speed);replayTimer=setTimeout(scheduleReplayStep,delay)}
$('replayScrubber').oninput=()=>{stopReplay();showReplayFrame(Number($('replayScrubber').value));$('replayBtn').textContent='RESUME REPLAY'};
$('speedSelect').onchange=()=>{if(replayPlaying){if(replayTimer)clearTimeout(replayTimer);scheduleReplayStep()}else if(replayTimes.length)$('replayStatus').textContent=`Paused · ${$('speedSelect').value}×`};
$('replayBtn').onclick=()=>{if(!replayTimes.length){$('replayStatus').textContent='Load a race first';return}if(replayPlaying){stopReplay();$('replayStatus').textContent='Replay paused';return}if(replayIndex>=replayTimes.length-1)replayIndex=0;replayPlaying=true;$('replayBtn').textContent='PAUSE REPLAY';scheduleReplayStep()};
$('driverToggle').onclick=()=>{$('driverPanel').classList.toggle('open');$('radioStatus').textContent=$('driverPanel').classList.contains('open')?'Choose the drivers you want to hear':'Choose drivers for team radio'};
$('closePanel').onclick=()=>$('driverPanel').classList.remove('open');
$('allDrivers').onclick=()=>{selected=new Set(driverList.map(d=>Number(d.driver_number)));saveSelection()};
$('noDrivers').onclick=()=>{selected.clear();saveSelection()};
$('radioToggle').onclick=async()=>{radioEnabled=!radioEnabled;$('radioToggle').classList.toggle('active',radioEnabled);$('radioToggle').textContent=radioEnabled?'RADIO ON':'RADIO OFF';if(radioEnabled){radioPrimed=true;if(testMode){historicalRadio=[];playedHistoricalRadio.clear();await pollRadio()}if(!selected.size){$('radioStatus').textContent='Select at least one driver';$('driverPanel').classList.add('open');}else{$('radioStatus').textContent='Listening for selected drivers';await pollRadio();playNext()}}else{$('radioStatus').textContent='Team radio paused';radioQueue=[];$('radioAudio').pause();radioBusy=false}};
function radioKey(x){return `${x.driver_number}|${x.date}|${x.recording_url}`}
async function pollRadio(){if(!sessionKey||!radioPrimed)return;try{const records=await get(`team_radio?session_key=${sessionKey}`);const ordered=(records||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
if(testMode){historicalRadio=ordered.filter(x=>x.recording_url);radioFirstPoll=false;$('radioStatus').textContent=historicalRadio.length?`${historicalRadio.length} race radio clips loaded`:'No radio recordings for this race';return}
if(radioFirstPoll){ordered.forEach(x=>knownRadio.add(radioKey(x)));radioFirstPoll=false;return}
for(const item of ordered){const key=radioKey(item);if(knownRadio.has(key))continue;knownRadio.add(key);if(radioEnabled&&selected.has(Number(item.driver_number))&&item.recording_url)radioQueue.push(item)}
if(radioQueue.length){$('radioStatus').textContent=`${radioQueue.length} selected radio message(s) queued`;playNext()}else if(radioEnabled&&selected.size)$('radioStatus').textContent='Listening — waiting for selected drivers'
}catch(e){$('radioStatus').textContent='Radio feed unavailable';}}
function playNext(){if(!radioEnabled||radioBusy||!radioQueue.length)return;const item=radioQueue.shift(),d=driverList.find(x=>Number(x.driver_number)===Number(item.driver_number)),name=d?.name_acronym||`CAR ${item.driver_number}`,audio=$('radioAudio');radioBusy=true;$('radioStatus').textContent=`PLAYING ${name} TEAM RADIO`;audio.src=item.recording_url;audio.play().then(()=>{}).catch(()=>{radioBusy=false;$('radioStatus').textContent='Tap RADIO ON to allow audio playback';});}
$('radioAudio').addEventListener('ended',()=>{radioBusy=false;playNext()});
$('radioAudio').addEventListener('error',()=>{radioBusy=false;$('radioStatus').textContent='Could not play this radio recording';playNext()});
async function loadMotionData(key,drivers,positions){
try{
const cutoff=encodeURIComponent(new Date(Date.now()-30000).toISOString());
const [locations,cars]=await Promise.all([get(`location?session_key=${key}&date>${cutoff}`),get(`car_data?session_key=${key}&date>${cutoff}`)]);
if(key!==sessionKey)return;
locationRows=locations||[];carDataRows=cars||[];
renderTrack(positions,drivers);renderTelemetry(positions,drivers,carDataRows);
}catch(e){/* Keep timing and controls working if motion data is unavailable. */}
}
let lastReplayMotionStamp='',lastReplayMotionFetchAt=0,replayMotionRequest=0;
async function loadReplayMotion(stamp,positions){
const stampMs=Date.parse(stamp);
if(lastReplayMotionStamp===stamp)return;
if(Number.isFinite(stampMs)&&stampMs-lastReplayMotionFetchAt<1000)return;
lastReplayMotionStamp=stamp;
if(Number.isFinite(stampMs))lastReplayMotionFetchAt=stampMs;
const requestId=++replayMotionRequest,sessionAtRequest=sessionKey;
try{
const centre=Date.parse(stamp),from=new Date(centre-4000).toISOString(),to=new Date(centre+4000).toISOString();
const base=`session_key=${sessionAtRequest}&date>${encodeURIComponent(from)}&date<${encodeURIComponent(to)}`;
const [loc,cars]=await Promise.all([get(`location?${base}`),get(`car_data?${base}`)]);
if(!testMode||sessionKey!==sessionAtRequest||requestId!==replayMotionRequest)return;
locationRows=loc||[];carDataRows=cars||[];
renderTrack(positions,driverList,stamp);renderTelemetry(positions,driverList,carDataRows,stamp);
}catch(e){
if(requestId===replayMotionRequest)$('trackNote').textContent='Historical car location unavailable for this replay time';
}
}
function teamColour(d){return /^([0-9a-f]{6})$/i.test(d?.team_colour||'')?`#${d.team_colour}`:'#aaa'}
function renderTrack(positionRows,drivers,stamp){
const svg=$('trackCanvas'),latest=stamp?interpolatedLocations(locationRows,stamp):latestByDriver(locationRows),driverMap=new Map((drivers||[]).map(d=>[Number(d.driver_number),d]));
const points=[...latest.entries()].map(([n,p])=>({n:Number(n),x:Number(p.x),y:Number(p.y),d:driverMap.get(Number(n))})).filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)&&p.x!==0&&p.y!==0);
const outline=trackOutlineRows.filter(p=>Number.isFinite(Number(p.x))&&Number.isFinite(Number(p.y))&&Number(p.x)!==0&&Number(p.y)!==0);
if(!points.length){svg.innerHTML='<text x="250" y="180" fill="#aaa" text-anchor="middle" font-size="16">TRACK DATA NOT AVAILABLE</text>';$('trackNote').textContent='Location data appears when the cars are on track';return}
const allX=[...points.map(p=>p.x),...outline.map(p=>Number(p.x))],allY=[...points.map(p=>p.y),...outline.map(p=>Number(p.y))];
const minX=Math.min(...allX),maxX=Math.max(...allX),minY=Math.min(...allY),maxY=Math.max(...allY),spanX=maxX-minX||1,spanY=maxY-minY||1,scale=Math.min(420/spanX,285/spanY),ox=(500-spanX*scale)/2,oy=(360-spanY*scale)/2;
const xy=p=>`${(ox+(Number(p.x)-minX)*scale).toFixed(1)},${(360-(oy+(Number(p.y)-minY)*scale)).toFixed(1)}`;
const stride=Math.max(1,Math.ceil(outline.length/1200)),outlineSample=outline.filter((p,i)=>i%stride===0);
const coords=outlineSample.map(p=>{const v=xy(p).split(',').map(Number);return {x:v[0],y:v[1]}});
let smoothPath='';
if(coords.length>2){smoothPath=`M ${coords[0].x} ${coords[0].y}`;for(let j=1;j<coords.length-1;j++){const midX=(coords[j].x+coords[j+1].x)/2,midY=(coords[j].y+coords[j+1].y)/2;smoothPath+=` Q ${coords[j].x} ${coords[j].y} ${midX} ${midY}`;}const last=coords[coords.length-1];smoothPath+=` L ${last.x} ${last.y}`;}
const path=smoothPath?`<path d="${smoothPath}" fill="none" stroke="#555" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity=".38"/><path d="${smoothPath}" fill="none" stroke="#aaa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`:'';
const posMap=latestByDriver(positionRows);
const marks=points.map(p=>{const x=ox+(p.x-minX)*scale,y=360-(oy+(p.y-minY)*scale),pos=Number(posMap.get(p.n)?.position)||'–',col=teamColour(p.d);return `<g><circle cx="${x}" cy="${y}" r="11" fill="${col}" stroke="#fff" stroke-width="1.5"/><text x="${x}" y="${y+3.5}" fill="#000" text-anchor="middle" font-size="10" font-weight="900">${pos}</text></g>`}).join('');
svg.innerHTML=`<rect width="500" height="360" fill="transparent"/>${path}<text x="250" y="20" fill="#888" text-anchor="middle" font-size="10" letter-spacing="2">LIVE CAR POSITIONS · ${points.length} CARS</text>${marks}`;
$('trackNote').textContent=coords.length>2?'Smoothed circuit outline from recorded GPS positions · car markers show current race positions':'Circuit outline unavailable for this session';
}
function renderTelemetry(positionRows,drivers,records,stamp){
const driverMap=new Map((drivers||[]).map(d=>[Number(d.driver_number),d])),positions=latestByDriver(positionRows),data=stamp?nearestByDriver(records,stamp):latestByDriver(records);
const list=[...driverMap.entries()].map(([n,d])=>({n,d,p:positions.get(n),t:data.get(n)})).sort((a,b)=>(Number(a.p?.position)||99)-(Number(b.p?.position)||99));
$('telemetryRows').innerHTML=list.map(x=>{const t=x.t||{},p=Number(x.p?.position)||'–';return `<div class="telemetry-row"><span class="tpos">${p}</span><span class="tdriver"><i class="tbar" style="background:${teamColour(x.d)}"></i>${x.d.name_acronym||x.n}</span><span>${Number.isFinite(Number(t.speed))?Math.round(Number(t.speed)):'–'}</span><span>${t.n_gear??'–'}</span><span>${t.rpm?Math.round(t.rpm):'–'}</span><span>${t.throttle??'–'}</span><span>${t.brake===undefined?'–':(Number(t.brake)>0?'ON':'OFF')}</span></div>`}).join('');
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{activeView=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===activeView+'View'))}));

async function refresh(){if(busy||replayPlaying)return;busy=true;try{
if(firstLoad&&!testMode){const s=await get('sessions?session_key=latest');currentSession=s?.[0]||null;if(currentSession?.session_key)sessionKey=currentSession.session_key}
const [positions,intervals,drivers,laps]=await Promise.all([get(`position?session_key=${sessionKey}`),get(`intervals?session_key=${sessionKey}`),get(`drivers?session_key=${sessionKey}`),firstLoad?get(`laps?session_key=${sessionKey}`):Promise.resolve([])]);
render(positions,intervals,drivers,currentSession,laps);firstLoad=false;
loadMotionData(sessionKey,drivers,positions);
}catch(err){$('dot').classList.remove('live');$('state').textContent='NO LIVE';$('message').textContent=/401|403|429/.test(err.message)?'LIVE DATA ACCESS / LIMIT REACHED':err.message.toUpperCase();$('message').className='error';if(!lastGood)$('session').textContent='WAITING FOR SESSION DATA';
}finally{busy=false}}
// iPhone Safari touch fallback: convert a tap into the same button click action.
document.addEventListener('touchend',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;e.preventDefault();b.click()},{passive:false});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});window.addEventListener('keydown',e=>{if(['Enter','ArrowDown','ArrowUp'].includes(e.key))refresh()});refresh();loadSeasonRaceList();setInterval(refresh,POLL_MS);setInterval(pollRadio,RADIO_POLL_MS);
})();
</script>
